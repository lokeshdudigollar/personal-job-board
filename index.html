<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="JobHunt.ai"/>
  <meta name="theme-color" content="#040d1a"/>
  <title>JobHunt.ai</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icon-192.png"/>
  <link rel="apple-touch-icon" href="icon-512.png"/>

  <!-- Google Identity Services (OAuth) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    html,body,#root{margin:0;padding:0;width:100%;min-height:100%;background:#040d1a;
      padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
    #splash{position:fixed;inset:0;background:#040d1a;display:flex;flex-direction:column;
      align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s;}
    #splash.hide{opacity:0;pointer-events:none;}
    #splash-icon{width:72px;height:72px;border-radius:18px;
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      display:flex;align-items:center;justify-content:center;
      font-size:36px;margin-bottom:20px;animation:pulse 1.5s ease-in-out infinite;}
    #splash h1{font-family:system-ui,sans-serif;font-size:28px;font-weight:800;
      color:#e2e8f0;letter-spacing:-0.02em;margin:0 0 8px;}
    #splash p{font-family:monospace;color:#475569;font-size:13px;margin:0;}
    @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #3b82f644;}
      50%{transform:scale(1.05);box-shadow:0 0 0 16px #3b82f600;}}
    #install-banner{position:fixed;bottom:16px;left:16px;right:16px;
      background:#0d1f38;border:1px solid #1e3a5f;border-radius:12px;
      padding:14px 16px;display:none;align-items:center;gap:12px;
      z-index:500;box-shadow:0 8px 32px #00000088;}
    #install-banner.show{display:flex;}
    #install-banner span{flex:1;font-family:monospace;font-size:12px;color:#94a3b8;}
    #install-btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;
      border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;
      cursor:pointer;font-family:monospace;white-space:nowrap;}
    #dismiss-btn{background:transparent;border:none;color:#475569;font-size:18px;cursor:pointer;padding:0 4px;}
    #offline-bar{display:none;position:fixed;top:0;left:0;right:0;background:#7f1d1d;
      color:#fca5a5;text-align:center;font-family:monospace;font-size:12px;padding:6px;z-index:1000;}
    #offline-bar.show{display:block;}
  </style>
</head>
<body>
<div id="offline-bar">📡 You're offline — showing cached jobs</div>
<div id="splash">
  <div id="splash-icon">⚡</div>
  <h1>JobHunt<span style="color:#3b82f6">.</span>ai</h1>
  <p>Loading your job board…</p>
</div>
<div id="root"></div>
<div id="install-banner">
  <span>📲 Install JobHunt.ai for the full app experience</span>
  <button id="install-btn">Install</button>
  <button id="dismiss-btn">✕</button>
</div>

(function hideSplash() {
  var check = setInterval(function () {
    var root = document.getElementById("root");
    var s = document.getElementById("splash");
    if (!s) {
      clearInterval(check);
      return;
    }
    if (root && root.children.length > 0) {
      clearInterval(check);
      s.classList.add("hide");
      setTimeout(function () {
        return s && s.remove();
      }, 600);
    }
  }, 150);
  setTimeout(function () {
    clearInterval(check);
    var s = document.getElementById("splash");
    s && s.remove();
  }, 8000);
})();

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt;
const banner=document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  setTimeout(()=>banner.classList.add('show'),6000);
});
document.getElementById('install-btn').addEventListener('click',async()=>{
  banner.classList.remove('show');
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
});
document.getElementById('dismiss-btn').addEventListener('click',()=>banner.classList.remove('show'));
const offBar=document.getElementById('offline-bar');
function updateOnline(){ offBar.classList.toggle('show',!navigator.onLine); }
window.addEventListener('online',updateOnline); window.addEventListener('offline',updateOnline); updateOnline();
</script>
