// ─── Gemini API ───────────────────────────────────────────────────────────────
async function callGemini(prompt, jsonMode=false) {
  const body = {
    contents:[{ parts:[{ text: prompt }] }],
    generationConfig:{ temperature:0.3, maxOutputTokens:2048,
      ...(jsonMode ? { responseMimeType:"application/json" } : {}) }
  };
  const res = await fetch(GEMINI_URL, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if (!res.ok) { const e=await res.text(); throw new Error(`Gemini error: ${e}`); }
  const d = await res.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

async function scoreJob(job, profile) {
  if (!profile.skills && !profile.summary) return { score:0, reasons:["Complete your profile to get match scores"] };
  const prompt = `You are a recruiter scoring a candidate-job match.
CANDIDATE: ${profile.title}, Skills: ${profile.skills}, Summary: ${profile.summary?.slice(0,300)}
JOB: ${job.title} at ${job.company}. ${(job.description||"").slice(0,500)}
Respond ONLY with JSON: {"score":<0-100>,"reasons":["reason1","reason2","reason3"]}`;
  try {
    const text = await callGemini(prompt, true);
    return JSON.parse(text.replace(/```json|```/g,"").trim());
  } catch { return { score:50, reasons:["Could not compute match"] }; }
}

function initGoogleAuth(onToken) {

function getStoredToken() {

}

async function gmailFetch(path, token) {
  const res = await fetch(`https://gmail.googleapis.com/gmail/v1${path}`, {
    headers:{ Authorization:`Bearer ${token}` }
  });
  if (res.status === 401) { ls.set(GTOKEN_KEY, null); throw new Error("Token expired"); }
  return res.json();
}

function b64decode(str) {
  try {
    const s = str.replace(/-/g,"+").replace(/_/g,"/");
    return decodeURIComponent(escape(atob(s)));
  } catch { return ""; }
}

function extractBody(payload) {
  if (!payload) return "";
  // Try plain text first
  if (payload.mimeType === "text/plain" && payload.body?.data) return b64decode(payload.body.data);
  // Multipart
  if (payload.parts) {
    for (const part of payload.parts) {
      if (part.mimeType === "text/plain" && part.body?.data) return b64decode(part.body.data);
    }
    for (const part of payload.parts) {
      const nested = extractBody(part);
      if (nested) return nested;
    }
  }
  if (payload.body?.data) return b64decode(payload.body.data);
  return "";
}

async function fetchJobEmailsFromGmail(token) {
  const allSenders = PLATFORMS.filter(p=>p.emailSource).flatMap(p=>p.senders);
  const senderQ = allSenders.map(s=>`from:${s}`).join(" OR ");
  const query = encodeURIComponent(`(${senderQ}) newer_than:7d`);

  // List messages
  const listRes = await gmailFetch(`/users/me/messages?q=${query}&maxResults=30`, token);
  if (!listRes.messages?.length) return [];

  // Fetch each message
  const messages = await Promise.all(
    listRes.messages.map(m =>
      gmailFetch(`/users/me/messages/${m.id}?format=full`, token).catch(()=>null)
    )
  );

  // Group by platform
  const grouped = {};
  for (const msg of messages.filter(Boolean)) {
    const fromHeader = msg.payload?.headers?.find(h=>h.name.toLowerCase()==="from")?.value||"";
    const subjectHeader = msg.payload?.headers?.find(h=>h.name.toLowerCase()==="subject")?.value||"";
    const body = extractBody(msg.payload);
    const from = fromHeader.toLowerCase();

    const platform = PLATFORMS.find(p =>
      p.emailSource && p.senders?.some(s => from.includes(s.split("@")[1].split(".")[0]))
    );
    if (!platform) continue;
    if (!grouped[platform.id]) grouped[platform.id] = [];
    grouped[platform.id].push(`SUBJECT: ${subjectHeader}\n${body}`);
  }

  // Parse jobs per platform with Gemini
  const jobs = [];
  for (const [platformId, bodies] of Object.entries(grouped)) {
    const parsed = await parseEmailJobs(bodies.join("\n\n---\n\n"), platformId);
    for (const j of parsed) {
      const remote = j.remote || /remote/i.test(j.location||"");
      const loc = j.location || (remote ? "Remote" : "");
      if (!remote && !/bengaluru|bangalore/i.test(loc)) continue;
      jobs.push({
        id:`email_${platformId}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
        platform:platformId, source:"email",
        title:j.title||"Software Engineer",
        company:j.company||"Unknown",
        description:j.description||"",
        salary:j.salary||null, remote,
        location:remote?"Remote – Worldwide":loc,
        country:detectCountry(j.location||""),
        url:j.url||platformUrl(platformId,j.title),
        score:null, reasons:[], scoreLoading:false,
        postedAt:"from email",
      });
    }
  }
  return jobs;
}

// ─── YC Jobs ──────────────────────────────────────────────────────────────────
async function fetchYCJobs() {
  try {
    const u = await fetch("https://hacker-news.firebaseio.com/v0/user/whoishiring.json").then(r=>r.json());
    const stories = await Promise.all((u.submitted||[]).slice(0,5).map(id=>fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r=>r.json())));
    const thread = stories.find(s=>s.title?.includes("Who is Hiring")&&s.title?.includes("2025"));
    if (!thread) return [];
    const comments = await Promise.all((thread.kids||[]).slice(0,60).map(id=>fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r=>r.json()).catch(()=>null)));
    return comments.filter(Boolean).filter(c=>c.text?.length>100).map(c=>{
      const text=c.text.replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&#x27;/g,"'");
      const lines=text.split("|").map(l=>l.trim());
      const remote=/remote/i.test(text);
      const loc=text.match(/\b(Bangalore|Bengaluru|San Francisco|New York|London|Berlin|Singapore|Toronto)\b/i)?.[1];
      return { id:`yc_${c.id}`, platform:"yc", source:"api",
        title:lines[1]||"Software Engineer", company:lines[0]||"Unknown",
        description:text.slice(0,800), remote,
        location:remote?"Remote":(loc||"Unknown"),
        country:detectCountry(text),
        url:`https://news.ycombinator.com/item?id=${c.id}`,
        score:null, reasons:[], scoreLoading:false,
        postedAt:new Date(c.time*1000).toLocaleDateString() };
    });
  } catch { return []; }
}

function detectCountry(text) {
  const t=text.toLowerCase();
  if(/\busa?\b|united states|san francisco|new york|seattle/i.test(t)) return "🇺🇸 USA";
  if(/\buk\b|united kingdom|london/i.test(t)) return "🇬🇧 UK";
  if(/\bindia\b|bangalore|bengaluru|mumbai|delhi|hyderabad/i.test(t)) return "🇮🇳 India";
  if(/\bgermany\b|berlin|munich/i.test(t)) return "🇩🇪 Germany";
  if(/\bcanada\b|toronto|vancouver/i.test(t)) return "🇨🇦 Canada";
  if(/\bsingapore\b/i.test(t)) return "🇸🇬 Singapore";
  return "🌍 Global";
}

    indeed:`https://in.indeed.com/jobs?q=${q}`,

  const [gmailUser,setGmailUser]   = useState(null);
  const [gmailReady,setGmailReady] = useState(false);

  function showToast(msg,type="success"){setToast({msg,type});setTimeout(()=>setToast(null),3500);}

  // Init Google Auth
  useEffect(()=>{
    initGoogleAuth((token)=>{
      setGmailReady(true);
      // Try to get user info
      fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:`Bearer ${token}`}})
        .then(r=>r.json()).then(u=>setGmailUser(u)).catch(()=>{});
    });
    // Check for existing valid token
    const stored = getStoredToken();
    if (stored) {
      setGmailReady(true);
      fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:`Bearer ${stored}`}})
        .then(r=>r.json()).then(u=>setGmailUser(u)).catch(()=>setGmailReady(false));
    }
  },[]);

  // Load board jobs
  const loadBoardJobs = useCallback(async()=>{
    setLoading(true);
    let all=[];
    if(selPlatforms.includes("yc")) all=[...all,...await fetchYCJobs()];
    for(const p of PLATFORMS.filter(p=>p.id!=="yc")){
      if(!selPlatforms.includes(p.id)) continue;
      const hasEmail = emailJobs.some(j=>j.platform===p.id);
      if(!hasEmail) all=[...all,...generateMockJobs(p.id)];
    }
    all=all.filter(j=>j.remote||/bengaluru|bangalore/i.test(j.location));
    setJobs(all); setLoading(false);
    scoreAllJobs(all);
  },[selPlatforms,emailJobs]);

  async function scoreAllJobs(jobList) {
    if(!profile.skills&&!profile.summary) return;
    const batch=jobList.slice(0,24);
    for(let i=0;i<batch.length;i+=3){
      const chunk=batch.slice(i,i+3);
      const upLoad=arr=>arr.map(j=>chunk.find(c=>c.id===j.id)?{...j,scoreLoading:true}:j);
      setJobs(p=>upLoad(p)); setEmailJobs(p=>upLoad(p));
      const results=await Promise.all(chunk.map(j=>scoreJob(j,profile)));
      const applyRes=arr=>arr.map(j=>{
        const idx=chunk.findIndex(c=>c.id===j.id); if(idx===-1)return j;
        return{...j,score:results[idx].score,reasons:results[idx].reasons,scoreLoading:false};
      });
      setJobs(p=>applyRes(p)); setEmailJobs(p=>applyRes(p));
    }
  }

  useEffect(()=>{ loadBoardJobs(); },[]);

  // Gmail sync
  async function handleGmailSync() {
    let token = getStoredToken();
    if (!token) {
      // Need to sign in
      if (!tokenClient) { showToast("Google Auth not ready yet, try again","error"); return; }
      tokenClient.requestAccessToken();
      return;
    }
    setFetchingEmail(true);
    try {
      const fetched = await fetchJobEmailsFromGmail(token);
      if(!fetched.length){ showToast("No new job alerts found in last 7 days","info"); }
      else { showToast(`Found ${fetched.length} job${fetched.length>1?"s":""} from your emails! 📧`); }
      const merged=[...fetched,...emailJobs.filter(ej=>!fetched.some(fj=>fj.company===ej.company&&fj.title===ej.title))].slice(0,100);
      setEmailJobs(merged); ls.set(EMAIL_JOBS_KEY,merged);
      scoreAllJobs(fetched);
    } catch(e) {
      if(e.message==="Token expired"){ ls.set(GTOKEN_KEY,null); setGmailReady(false); showToast("Session expired — sign in again","error"); }
      else showToast("Email sync failed: "+e.message,"error");
    }
    setFetchingEmail(false);
  }

  function handleSignOut() {
    ls.set(GTOKEN_KEY,null); setGmailUser(null); setGmailReady(false);
    if(window.google?.accounts?.oauth2) window.google.accounts.oauth2.revoke(getStoredToken()||"",()=>{});
    showToast("Signed out of Google");
  }

  const allVisibleJobs=[...emailJobs,...jobs]
    .filter((j,i,arr)=>arr.findIndex(x=>x.id===j.id)===i)
    .filter(j=>selPlatforms.includes(j.platform))
    .filter(j=>j.score===null||j.score>=minScore)
    .filter(j=>remoteFilter==="all"?true:remoteFilter==="remote"?j.remote:!j.remote)
    .filter(j=>sourceFilter==="all"?true:sourceFilter==="email"?j.source==="email":j.source!=="email")
    .sort((a,b)=>(b.score||0)-(a.score||0));

  function handleSaveProfile(p){ setProfile(p); ls.set(STORAGE_KEY,p); showToast("Profile saved!"); setTab("jobs"); }

  async function startApplyFlow(job) {
    const hasCL=PLATFORMS.find(p=>p.id===job.platform)?.coverLetter;
    setApplyFlow({stage:"generating",job,cv:null,coverLetter:null,missingFields:[],extraAnswers:{},activeDoc:"cv"});
    const [cv,cl,missing]=await Promise.all([
      generateCuratedCV(job,profile),
      hasCL?generateCoverLetter(job,profile):Promise.resolve(null),
      detectMissingFields(job,profile,loadExtraAnswers()),
    ]);
    const saved=loadExtraAnswers();
    setApplyFlow(prev=>({...prev,stage:"review",cv,coverLetter:cl,
      missingFields:missing.filter(f=>!saved[f.field]),extraAnswers:saved}));
  }

  function handleApproveDocuments() {
    if(applyFlow.missingFields.length>0) setApplyFlow(prev=>({...prev,stage:"missing_fields"}));
    else executeApply();
  }

  function handleMissingAnswersSubmit(answers) {
    const merged={...loadExtraAnswers(),...answers};
    saveExtraAnswers(merged);
    executeApply(merged);
  }

  function executeApply() {
    const {job}=applyFlow;
    markApplied(job.id); setApplied(loadApplied());
    window.open(job.url,"_blank");
    setApplyFlow(null);
    showToast(`Opened ${job.company} — form ready to fill!`);
  }

  return (
    <div style={{minHeight:"100vh",background:"#040d1a",color:"#e2e8f0",fontFamily:"'DM Mono','Fira Code',monospace"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a1628}::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
        .jcard{transition:all 0.2s;border:1px solid #1e293b;}
        .jcard:hover{border-color:#334155;transform:translateY(-2px);box-shadow:0 8px 32px #00000088;}
        .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
        .btn{cursor:pointer;border:none;font-family:inherit;transition:all 0.15s;}
        .btn:hover{opacity:0.85;} .btn:disabled{opacity:0.4;cursor:not-allowed;}
        input,textarea,select{background:#0a1628;border:1px solid #1e293b;color:#e2e8f0;font-family:inherit;font-size:13px;padding:8px 12px;border-radius:6px;width:100%;outline:none;}
        input:focus,textarea:focus,select:focus{border-color:#3b82f6;}
        .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid;transition:all 0.15s;user-select:none;}
        .overlay{position:fixed;inset:0;background:#00000099;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
        .modal{background:#0d1f38;border:1px solid #1e3a5f;border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:28px;}
        .dtab{padding:7px 18px;border-radius:8px 8px 0 0;font-size:12px;cursor:pointer;border:1px solid;font-family:inherit;}
        .dtab.on{background:#061122;border-color:#1e3a5f;border-bottom-color:#061122;color:#e2e8f0;}
        .dtab.off{background:transparent;border-color:transparent;color:#475569;}
        .slider{-webkit-appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,#3b82f6 0%,#3b82f6 var(--val,0%),#1e293b var(--val,0%),#1e293b 100%);}
        .slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#3b82f6;cursor:pointer;}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .fade{animation:fadeIn 0.3s ease;} .spin{animation:spin 1s linear infinite;display:inline-block;}
        .sl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#475569;margin-bottom:6px;}
        .applied-badge{font-size:9px;padding:1px 6px;border-radius:3px;background:#16532d22;color:#4ade80;border:1px solid #16532d44;font-weight:700;}
        .google-btn{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid #1e293b;background:#0a1628;color:#e2e8f0;cursor:pointer;font-family:inherit;font-size:12px;transition:all 0.15s;}
        .google-btn:hover{border-color:#334155;background:#0f1f33;}
      `}</style>

      {/* Header */}
      <div style={{borderBottom:"1px solid #1e293b",padding:"0 16px"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",gap:12,height:60,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:28,height:28,borderRadius:6,background:"linear-gradient(135deg,#3b82f6,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>⚡</div>
            <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,letterSpacing:"-0.02em"}}>JobHunt<span style={{color:"#3b82f6"}}>.</span>ai</span>
          </div>

          {/* Gmail sync / sign-in */}
          {gmailUser ? (
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <button className="google-btn" onClick={handleGmailSync} disabled={fetchingEmail}>
                {fetchingEmail?<span className="spin" style={{fontSize:13}}>⟳</span>:"📧"}
                {fetchingEmail?"Scanning…":`Sync Email Jobs${emailJobs.length?` (${emailJobs.length})`:""}`}
              </button>
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:8,background:"#0a1e10",border:"1px solid #065f4644",fontSize:11,color:"#34d399"}}>
                {gmailUser.picture&&<img src={gmailUser.picture} style={{width:18,height:18,borderRadius:9}} alt=""/>}
                {gmailUser.email?.split("@")[0]}
                <button className="btn" onClick={handleSignOut} style={{fontSize:10,color:"#475569",marginLeft:2}}>✕</button>
              </div>
            </div>
          ) : (
            <button className="google-btn" onClick={()=>tokenClient?.requestAccessToken()}>
              <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Sign in with Google to sync emails
            </button>
          )}

          <div style={{flex:1}}/>
          {/* Powered by Gemini badge */}
          <div style={{fontSize:10,padding:"3px 8px",borderRadius:6,background:"#1a1a2e",border:"1px solid #4285f422",color:"#7ba7f7",display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontSize:12}}>✦</span> Powered by Gemini
          </div>
          {["jobs","profile"].map(t=>(
            <button key={t} className="btn" onClick={()=>setTab(t)}
              style={{padding:"6px 14px",borderRadius:6,fontSize:13,fontFamily:"inherit",
                background:tab===t?"#1e3a5f":"transparent",
                color:tab===t?"#60a5fa":"#64748b",
                border:`1px solid ${tab===t?"#2563eb44":"transparent"}`}}>
              {t==="jobs"?"🔍 Jobs":"👤 Profile"}
            </button>
          ))}
          <div style={{width:8,height:8,borderRadius:4,background:profile.name?"#22c55e":"#ef4444"}}/>
        </div>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 16px"}}>
        {tab==="jobs"
          ?<JobsTab jobs={allVisibleJobs} allJobs={[...emailJobs,...jobs]} loading={loading}
              minScore={minScore} setMinScore={setMinScore}
              selPlatforms={selPlatforms} setSelPlatforms={setSelPlatforms}
              remoteFilter={remoteFilter} setRemoteFilter={setRemoteFilter}
              sourceFilter={sourceFilter} setSourceFilter={setSourceFilter}
              selectedJob={selectedJob} setSelectedJob={setSelectedJob}
              onRefresh={loadBoardJobs} onApply={startApplyFlow}
              applied={applied} gmailUser={gmailUser}
              onGmailConnect={()=>tokenClient?.requestAccessToken()}/>
          :<ProfileTab profile={profile} onSave={handleSaveProfile}/>
        }
      </div>

      {applyFlow&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setApplyFlow(null)}>
          <div className="modal fade">
            {applyFlow.stage==="generating"&&<GeneratingStage job={applyFlow.job}/>}
            {applyFlow.stage==="review"&&<ReviewStage flow={applyFlow} setFlow={setApplyFlow} onApprove={handleApproveDocuments} onClose={()=>setApplyFlow(null)} showToast={showToast}/>}
            {applyFlow.stage==="missing_fields"&&<MissingFieldsStage flow={applyFlow} onSubmit={handleMissingAnswersSubmit} onBack={()=>setApplyFlow(p=>({...p,stage:"review"}))}/>}
          </div>
        </div>
      )}

      {toast&&(
        <div style={{position:"fixed",bottom:24,right:24,background:toast.type==="error"?"#7f1d1d":toast.type==="info"?"#1e3a5f":"#16a34a",color:"white",padding:"10px 18px",borderRadius:8,fontSize:13,fontWeight:500,zIndex:200,animation:"fadeIn 0.2s ease",maxWidth:360}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ─── Apply Flow Stages ────────────────────────────────────────────────────────
function GeneratingStage({job}) {
  const [step,setStep]=useState(0);
  const steps=["Tailoring CV with Gemini…","Writing cover letter…","Detecting missing form fields…"];
  useEffect(()=>{const t=setInterval(()=>setStep(p=>p<steps.length-1?p+1:p),2800);return()=>clearInterval(t);},[]);
  return (
    <div style={{textAlign:"center",padding:"50px 20px"}}>
      <div style={{fontSize:40,marginBottom:16}} className="spin">✦</div>
      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18,marginBottom:8}}>Preparing your application</div>
      <div style={{color:"#64748b",fontSize:13,marginBottom:24}}>{job.title} @ {job.company}</div>
      <div style={{display:"flex",flexDirection:"column",gap:8,maxWidth:320,margin:"0 auto"}}>
        {steps.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,fontSize:12,color:i<=step?"#60a5fa":"#334155",transition:"color 0.4s"}}>
            <span>{i<step?"✅":i===step?"⟳":"○"}</span> {s}
          </div>
        ))}
      </div>
    </div>
  );
}

function ReviewStage({flow,setFlow,onApprove,onClose,showToast}) {
  const {job,cv,coverLetter,activeDoc}=flow;
  const hasCL=PLATFORMS.find(p=>p.id===job.platform)?.coverLetter;
  return (
    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
        <div>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18}}>✨ Review Your Application</div>
          <div style={{color:"#64748b",fontSize:12,marginTop:3}}>{job.title} @ {job.company}
            {hasCL&&<span style={{marginLeft:8,fontSize:10,padding:"1px 6px",borderRadius:3,background:"#7c3aed22",color:"#a78bfa",border:"1px solid #7c3aed44"}}>COVER LETTER</span>}
          </div>
        </div>
        <button className="btn" onClick={onClose} style={{background:"#1e293b",color:"#94a3b8",padding:"4px 10px",borderRadius:6,fontSize:13}}>✕</button>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid #1e3a5f"}}>
        <button className={`dtab btn ${activeDoc==="cv"?"on":"off"}`} onClick={()=>setFlow(p=>({...p,activeDoc:"cv"}))}>📄 CV / Resume</button>
        {hasCL&&<button className={`dtab btn ${activeDoc==="cl"?"on":"off"}`} onClick={()=>setFlow(p=>({...p,activeDoc:"cl"}))}>✉️ Cover Letter</button>}
      </div>
      <div style={{background:"#061122",border:"1px solid #1e3a5f",borderTop:"none",borderRadius:"0 0 8px 8px",padding:16,marginBottom:16}}>
        {activeDoc==="cv"
          ?<textarea value={cv||""} onChange={e=>setFlow(p=>({...p,cv:e.target.value}))} style={{width:"100%",minHeight:320,fontFamily:"'DM Mono',monospace",fontSize:12,lineHeight:1.7,resize:"vertical",background:"transparent",border:"none",color:"#cbd5e1",outline:"none",padding:0}}/>
          :<textarea value={coverLetter||""} onChange={e=>setFlow(p=>({...p,coverLetter:e.target.value}))} style={{width:"100%",minHeight:320,fontFamily:"'DM Mono',monospace",fontSize:12,lineHeight:1.7,resize:"vertical",background:"transparent",border:"none",color:"#cbd5e1",outline:"none",padding:0}}/>
        }
      </div>
      <div style={{padding:"10px 14px",background:"#0a1e38",border:"1px solid #1e3a5f",borderRadius:8,fontSize:11,color:"#60a5fa",marginBottom:16,lineHeight:1.8}}>
        <strong>After approval:</strong> Job page opens → paste CV &amp; cover letter into the form → profile fields auto-suggest → any unknown fields asked next
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>{navigator.clipboard.writeText(cv||"");showToast("CV copied!");}} style={{padding:"7px 13px",background:"#1e293b",color:"#94a3b8",borderRadius:8,fontSize:12}}>📋 Copy CV</button>
          {hasCL&&<button className="btn" onClick={()=>{navigator.clipboard.writeText(coverLetter||"");showToast("Cover letter copied!");}} style={{padding:"7px 13px",background:"#1e293b",color:"#94a3b8",borderRadius:8,fontSize:12}}>📋 Copy Letter</button>}
        </div>
        <button className="btn" onClick={onApprove} style={{padding:"9px 24px",background:"linear-gradient(135deg,#2563eb,#7c3aed)",color:"white",borderRadius:8,fontSize:13,fontWeight:700}}>✅ Approve &amp; Apply →</button>
      </div>
    </>
  );
}

function MissingFieldsStage({flow,onSubmit,onBack}) {
  const {job,missingFields,extraAnswers}=flow;
  const [answers,setAnswers]=useState(extraAnswers||{});
  const allFilled=missingFields.every(f=>answers[f.field]);
  return (
    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
        <div>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18}}>❓ A Few More Details</div>
          <div style={{color:"#64748b",fontSize:12,marginTop:3}}>{job.title} @ {job.company}</div>
        </div>
        <button className="btn" onClick={onBack} style={{background:"#1e293b",color:"#94a3b8",padding:"4px 10px",borderRadius:6,fontSize:12}}>← Back</button>
      </div>
      <div style={{padding:"10px 14px",background:"#1a1000",border:"1px solid #78350f44",borderRadius:8,fontSize:11,color:"#fbbf24",marginBottom:18,lineHeight:1.6}}>
        ℹ️ Gemini detected these fields in the job form but they're not in your profile. Answers are saved for future applications.
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:22}}>
        {missingFields.map(f=>(
          <div key={f.field}>
            <div className="sl">{f.question}</div>
            {f.type==="select"
              ?<select value={answers[f.field]||""} onChange={e=>setAnswers(p=>({...p,[f.field]:e.target.value}))}>
                <option value="">Select…</option>
                {(f.options||[]).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
              :<input type={f.type==="number"?"number":"text"} value={answers[f.field]||""} onChange={e=>setAnswers(p=>({...p,[f.field]:e.target.value}))} placeholder={`Enter ${f.field}…`}/>
            }
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button className="btn" onClick={onBack} style={{padding:"8px 16px",background:"#1e293b",color:"#94a3b8",borderRadius:8,fontSize:13}}>← Review Docs</button>
        <button className="btn" onClick={()=>onSubmit(answers)} disabled={!allFilled}
          style={{padding:"9px 24px",background:allFilled?"linear-gradient(135deg,#2563eb,#7c3aed)":"#1e293b",color:"white",borderRadius:8,fontSize:13,fontWeight:700}}>
          🚀 Submit &amp; Apply
        </button>
      </div>
    </>
  );
}

// ─── Jobs Tab ─────────────────────────────────────────────────────────────────
function JobsTab({jobs,allJobs,loading,minScore,setMinScore,selPlatforms,setSelPlatforms,remoteFilter,setRemoteFilter,sourceFilter,setSourceFilter,selectedJob,setSelectedJob,onRefresh,onApply,applied,gmailUser,onGmailConnect}) {
  const emailCount=allJobs.filter(j=>j.source==="email").length;
  return (
    <div>
      {/* Gmail connect nudge */}
      {!gmailUser&&(
        <div style={{padding:"12px 16px",background:"#0a1e10",border:"1px solid #065f4644",borderRadius:10,marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:"#34d399"}}>📧 Connect Gmail to import jobs from your LinkedIn, Indeed, Naukri, Instahyre & Hirist alert emails</span>
          <button className="btn" onClick={onGmailConnect} style={{padding:"6px 16px",background:"linear-gradient(135deg,#2563eb,#7c3aed)",color:"white",borderRadius:8,fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>Connect Gmail →</button>
        </div>
      )}

      {/* Filters */}
      <div style={{background:"#0a1628",border:"1px solid #1e293b",borderRadius:10,padding:"16px",marginBottom:20}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:14,alignItems:"center"}}>
          <div>
            <div className="sl">Platforms</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {PLATFORMS.map(p=>{const on=selPlatforms.includes(p.id);return(
                <span key={p.id} className="pill" onClick={()=>setSelPlatforms(prev=>prev.includes(p.id)?prev.filter(x=>x!==p.id):[...prev,p.id])}
                  style={{background:on?p.color+"22":"transparent",color:on?p.color:"#475569",borderColor:on?p.color+"66":"#1e293b"}}>
                  {on?"●":"○"} {p.name}
                  {p.realApi&&<span style={{fontSize:9,background:"#22c55e22",color:"#22c55e",padding:"1px 4px",borderRadius:3}}>LIVE</span>}
                  {p.emailSource&&<span style={{fontSize:9,background:"#065f4622",color:"#34d399",padding:"1px 4px",borderRadius:3}}>📧</span>}
                  {p.coverLetter&&<span style={{fontSize:9,background:"#7c3aed22",color:"#a78bfa",padding:"1px 4px",borderRadius:3}}>CL</span>}
                </span>);})}
            </div>
          </div>
          <div style={{width:1,height:32,background:"#1e293b",flexShrink:0}}/>
          <div>
            <div className="sl">Work Type</div>
            <div style={{display:"flex",gap:5}}>
              {[["all","All"],["remote","🌍 Remote"],["office","🏢 BLR"]].map(([v,l])=>(
                <span key={v} className="pill" onClick={()=>setRemoteFilter(v)}
                  style={{background:remoteFilter===v?"#3b82f622":"transparent",color:remoteFilter===v?"#60a5fa":"#475569",borderColor:remoteFilter===v?"#3b82f644":"#1e293b"}}>{l}</span>
              ))}
            </div>
          </div>
          <div style={{width:1,height:32,background:"#1e293b",flexShrink:0}}/>
          <div>
            <div className="sl">Source</div>
            <div style={{display:"flex",gap:5}}>
              {[["all","All"],["email","📧 Email"],["board","🔍 Board"]].map(([v,l])=>(
                <span key={v} className="pill" onClick={()=>setSourceFilter(v)}
                  style={{background:sourceFilter===v?"#3b82f622":"transparent",color:sourceFilter===v?"#60a5fa":"#475569",borderColor:sourceFilter===v?"#3b82f644":"#1e293b"}}>{l}</span>
              ))}
            </div>
          </div>
          <div style={{width:1,height:32,background:"#1e293b",flexShrink:0}}/>
          <div style={{minWidth:160}}>
            <div className="sl">Min Match: <span style={{color:"#60a5fa"}}>{minScore}%</span></div>
            <input type="range" min={0} max={90} step={5} value={minScore} onChange={e=>setMinScore(Number(e.target.value))} className="slider" style={{"--val":`${minScore}%`,width:"100%"}}/>
          </div>
          <div style={{flex:1}}/>
          <button className="btn" onClick={onRefresh} style={{background:"#1e3a5f",color:"#60a5fa",padding:"8px 14px",borderRadius:8,fontSize:12,border:"1px solid #2563eb44"}}>
            {loading?"⟳ …":"⟳ Refresh"}
          </button>
        </div>
      </div>

      <div style={{display:"flex",gap:10,marginBottom:18,fontSize:12,color:"#475569",flexWrap:"wrap"}}>
        <span><span style={{color:"#60a5fa",fontWeight:700}}>{jobs.length}</span> shown</span>·
        <span><span style={{color:"#22c55e",fontWeight:700}}>{allJobs.filter(j=>(j.score||0)>=75).length}</span> strong matches</span>·
        <span><span style={{color:"#34d399",fontWeight:700}}>{emailCount}</span> from email</span>·
        <span><span style={{color:"#4ade80",fontWeight:700}}>{applied.size}</span> applied</span>
      </div>

      <div style={{display:"grid",gridTemplateColumns:selectedJob?"360px 1fr":"1fr",gap:16}}>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {loading&&!jobs.length
            ?<div style={{textAlign:"center",padding:"60px 0",color:"#475569"}}><div className="spin" style={{fontSize:28}}>⟳</div><div style={{marginTop:10,fontSize:13}}>Fetching…</div></div>
            :jobs.length===0
            ?<div style={{textAlign:"center",padding:"60px 0",color:"#475569"}}><div style={{fontSize:36}}>🔍</div><div style={{marginTop:10}}>No jobs match filters</div></div>
            :jobs.map(job=>(
              <JobCard key={job.id} job={job} selected={selectedJob?.id===job.id} wasApplied={applied.has(job.id)}
                onClick={()=>setSelectedJob(p=>p?.id===job.id?null:job)}
                onApply={()=>onApply(job)} compact={!!selectedJob}/>
            ))
          }
        </div>
        {selectedJob&&(
          <div className="fade" style={{background:"#0a1628",border:"1px solid #1e293b",borderRadius:10,padding:"22px",position:"sticky",top:16,alignSelf:"flex-start",maxHeight:"85vh",overflow:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
              <div>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18,lineHeight:1.2}}>{selectedJob.title}</div>
                <div style={{color:"#64748b",fontSize:13,marginTop:4}}>{selectedJob.company}</div>
              </div>
              <button className="btn" onClick={()=>setSelectedJob(null)} style={{background:"#1e293b",color:"#94a3b8",padding:"4px 10px",borderRadius:6,fontSize:13}}>✕</button>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
              <ScoreBadge score={selectedJob.score} loading={selectedJob.scoreLoading}/>
              <span className="tag" style={{background:"#1e293b",color:"#94a3b8"}}>📍 {selectedJob.location}</span>
              <span className="tag" style={{background:"#1e293b",color:"#94a3b8"}}>{selectedJob.country}</span>
              <span className="tag" style={{background:selectedJob.remote?"#06402b":"#1e293b",color:selectedJob.remote?"#4ade80":"#94a3b8"}}>{selectedJob.remote?"🌍 Remote":"🏢 Office"}</span>
              <SourceBadge source={selectedJob.source}/>
              {selectedJob.salary&&<span className="tag" style={{background:"#1e2a1e",color:"#4ade80"}}>💰 {selectedJob.salary}</span>}
              {applied.has(selectedJob.id)&&<span className="applied-badge">✓ APPLIED</span>}
            </div>
            {selectedJob.reasons?.length>0&&(
              <div style={{marginBottom:16}}>
                <div className="sl">Match Insights</div>
                {selectedJob.reasons.map((r,i)=><div key={i} style={{fontSize:12,color:"#94a3b8",padding:"4px 0",borderBottom:"1px solid #0f172a"}}>• {r}</div>)}
              </div>
            )}
            <div className="sl">Description</div>
            <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.8,whiteSpace:"pre-wrap",background:"#061122",borderRadius:8,padding:14,marginBottom:16}}>
              {selectedJob.description}
            </div>
            <div style={{display:"flex",gap:8}}>
              <a href={selectedJob.url} target="_blank" rel="noreferrer" style={{flex:1,textAlign:"center",padding:"9px",background:"#1e293b",color:"#94a3b8",borderRadius:8,fontSize:12,textDecoration:"none"}}>🔗 View Job</a>
              <button className="btn" onClick={()=>onApply(selectedJob)} style={{flex:2,padding:"9px",background:"linear-gradient(135deg,#2563eb,#7c3aed)",color:"white",borderRadius:8,fontSize:12,fontWeight:600}}>
                {applied.has(selectedJob.id)?"✓ Applied — Apply Again":"✨ Generate Docs & Apply"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function JobCard({job,selected,wasApplied,onClick,onApply,compact}) {
  const plat=PLATFORMS.find(p=>p.id===job.platform)||{color:"#64748b"};
  return (
    <div className="jcard fade" onClick={onClick} style={{background:selected?"#0d1f38":"#080f1e",borderRadius:10,padding:"14px 16px",cursor:"pointer",borderColor:selected?"#2563eb44":"#1e293b",opacity:wasApplied?0.65:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:600,fontSize:compact?13:14,lineHeight:1.3,marginBottom:2}}>{job.title}</div>
          <div style={{fontSize:12,color:"#64748b"}}>{job.company}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
          <ScoreBadge score={job.score} loading={job.scoreLoading}/>
          {wasApplied&&<span className="applied-badge">✓ APPLIED</span>}
        </div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:10,alignItems:"center"}}>
        <span className="tag" style={{background:plat.color+"18",color:plat.color,border:`1px solid ${plat.color}33`,fontSize:10}}>{plat.name}</span>
        <span className="tag" style={{background:job.remote?"#06402b":"#1e2a3a",color:job.remote?"#4ade80":"#60a5fa",fontSize:10}}>{job.remote?"🌍 Remote":"🏢 BLR"}</span>
        <span className="tag" style={{background:"#1e293b",color:"#94a3b8",fontSize:10}}>{job.country}</span>
        <SourceBadge source={job.source}/>
        {!compact&&<span style={{flex:1}}/>}
        {!compact&&<button className="btn" onClick={e=>{e.stopPropagation();onApply();}} style={{padding:"4px 12px",background:"linear-gradient(135deg,#2563eb88,#7c3aed88)",color:"white",borderRadius:6,fontSize:11,fontWeight:600}}>Apply ✨</button>}
      </div>
      {!compact&&job.postedAt&&<div style={{fontSize:10,color:"#334155",marginTop:6}}>{job.postedAt}</div>}
    </div>
  );
}

// ─── Profile Tab ──────────────────────────────────────────────────────────────
function ProfileTab({profile,onSave}) {
  const [p,setP]=useState(profile);
  const [section,setSection]=useState("basic");
  const set=(f,v)=>setP(prev=>({...prev,[f]:v}));
  const setExp=(i,f,v)=>{const e=[...p.experience];e[i]={...e[i],[f]:v};setP(prev=>({...prev,experience:e}));};
  const addExp=()=>setP(prev=>({...prev,experience:[...prev.experience,{company:"",role:"",duration:"",description:""}]}));
  const remExp=(i)=>setP(prev=>({...prev,experience:prev.experience.filter((_,idx)=>idx!==i)}));
  const setEdu=(i,f,v)=>{const e=[...p.education];e[i]={...e[i],[f]:v};setP(prev=>({...prev,education:e}));};
  const addEdu=()=>setP(prev=>({...prev,education:[...prev.education,{institution:"",degree:"",year:""}]}));
  const remEdu=(i)=>setP(prev=>({...prev,education:prev.education.filter((_,idx)=>idx!==i)}));
  const Sec=({title,children})=><div style={{background:"#0a1628",border:"1px solid #1e293b",borderRadius:10,padding:"20px",marginBottom:16}}><div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:16,color:"#60a5fa"}}>{title}</div>{children}</div>;
  const F=({label,...props})=><div style={{marginBottom:12}}><div className="sl">{label}</div>{props.rows?<textarea {...props} style={{resize:"vertical",minHeight:props.rows*22}}/>:<input {...props}/>}</div>;
  return (
    <div style={{maxWidth:740}}>
      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,marginBottom:20}}>👤 Your Profile</div>
      <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
        {[["basic","🧑 Basic"],["links","🔗 Links & CTC"],["experience","💼 Experience"],["education","🎓 Education"],["templates","📄 Templates"]].map(([id,label])=>(
          <button key={id} className="btn" onClick={()=>setSection(id)}
            style={{padding:"6px 14px",borderRadius:20,fontSize:12,fontFamily:"inherit",background:section===id?"#1e3a5f":"transparent",color:section===id?"#60a5fa":"#475569",border:`1px solid ${section===id?"#2563eb44":"#1e293b"}`}}>{label}</button>
        ))}
      </div>
      {section==="basic"&&<Sec title="Basic Info">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <F label="Full Name" value={p.name} onChange={e=>set("name",e.target.value)} placeholder="Rahul Sharma"/>
          <F label="Email" value={p.email} onChange={e=>set("email",e.target.value)} placeholder="rahul@email.com"/>
          <F label="Phone" value={p.phone} onChange={e=>set("phone",e.target.value)} placeholder="+91 98765 43210"/>
          <F label="Location" value={p.location} onChange={e=>set("location",e.target.value)} placeholder="Bengaluru, India"/>
        </div>
        <F label="Current Title" value={p.title} onChange={e=>set("title",e.target.value)} placeholder="Senior Software Engineer"/>
        <F label="Professional Summary" value={p.summary} onChange={e=>set("summary",e.target.value)} placeholder="8 years building scalable backend systems…" rows={4}/>
        <F label="Skills (comma-separated)" value={p.skills} onChange={e=>set("skills",e.target.value)} placeholder="Node.js, React, PostgreSQL, AWS, Docker, Kubernetes, System Design…" rows={3}/>
      </Sec>}
      {section==="links"&&<Sec title="Links, CTC & Notice Period">
        <div style={{fontSize:12,color:"#475569",marginBottom:14,lineHeight:1.6}}>Used to auto-fill job application forms. Blank fields will be asked when you apply.</div>
        <F label="LinkedIn URL" value={p.linkedin} onChange={e=>set("linkedin",e.target.value)} placeholder="https://linkedin.com/in/yourname"/>
        <F label="GitHub URL" value={p.github} onChange={e=>set("github",e.target.value)} placeholder="https://github.com/yourname"/>
        <F label="Portfolio / Website" value={p.portfolio} onChange={e=>set("portfolio",e.target.value)} placeholder="https://yoursite.dev"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
          <F label="Current CTC (LPA)" value={p.currentCTC} onChange={e=>set("currentCTC",e.target.value)} placeholder="25"/>
          <F label="Expected CTC (LPA)" value={p.expectedCTC} onChange={e=>set("expectedCTC",e.target.value)} placeholder="35"/>
          <F label="Notice Period" value={p.noticePeriod} onChange={e=>set("noticePeriod",e.target.value)} placeholder="30 days"/>
        </div>
      </Sec>}
      {section==="experience"&&<Sec title="Work Experience">
        {p.experience.map((exp,i)=>(
          <div key={i} style={{border:"1px solid #1e293b",borderRadius:8,padding:"14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <span style={{fontSize:12,color:"#475569"}}>Experience {i+1}</span>
              {p.experience.length>1&&<button className="btn" onClick={()=>remExp(i)} style={{background:"#2d0f0f",color:"#ef4444",padding:"2px 8px",borderRadius:4,fontSize:11}}>Remove</button>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <F label="Company" value={exp.company} onChange={e=>setExp(i,"company",e.target.value)} placeholder="Flipkart"/>
              <F label="Role" value={exp.role} onChange={e=>setExp(i,"role",e.target.value)} placeholder="Senior Software Engineer"/>
            </div>
            <F label="Duration" value={exp.duration} onChange={e=>setExp(i,"duration",e.target.value)} placeholder="Jan 2021 – Present"/>
            <F label="Description" value={exp.description} onChange={e=>setExp(i,"description",e.target.value)} placeholder="Led backend architecture…" rows={3}/>
          </div>
        ))}
        <button className="btn" onClick={addExp} style={{background:"#1e293b",color:"#60a5fa",padding:"7px 14px",borderRadius:8,fontSize:12}}>+ Add Experience</button>
      </Sec>}
      {section==="education"&&<Sec title="Education">
        {p.education.map((edu,i)=>(
          <div key={i} style={{border:"1px solid #1e293b",borderRadius:8,padding:"14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <span style={{fontSize:12,color:"#475569"}}>Education {i+1}</span>
              {p.education.length>1&&<button className="btn" onClick={()=>remEdu(i)} style={{background:"#2d0f0f",color:"#ef4444",padding:"2px 8px",borderRadius:4,fontSize:11}}>Remove</button>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 100px",gap:10}}>
              <F label="Institution" value={edu.institution} onChange={e=>setEdu(i,"institution",e.target.value)} placeholder="IIT Bombay"/>
              <F label="Degree" value={edu.degree} onChange={e=>setEdu(i,"degree",e.target.value)} placeholder="B.Tech Computer Science"/>
              <F label="Year" value={edu.year} onChange={e=>setEdu(i,"year",e.target.value)} placeholder="2018"/>
            </div>
          </div>
        ))}
        <button className="btn" onClick={addEdu} style={{background:"#1e293b",color:"#60a5fa",padding:"7px 14px",borderRadius:8,fontSize:12}}>+ Add Education</button>
      </Sec>}
      {section==="templates"&&<>
        <Sec title="📄 CV Template">
          <div style={{fontSize:12,color:"#475569",marginBottom:10,lineHeight:1.6}}>Placeholders: {["{name}","{title}","{email}","{phone}","{location}","{summary}","{skills}","{experience}","{education}"].map(ph=><code key={ph} style={{color:"#60a5fa",marginRight:4}}>{ph}</code>)}</div>
          <textarea value={p.cvTemplate} onChange={e=>set("cvTemplate",e.target.value)} style={{width:"100%",minHeight:240,fontFamily:"'DM Mono',monospace",fontSize:12,lineHeight:1.7,resize:"vertical"}}/>
          <button className="btn" onClick={()=>set("cvTemplate",DEFAULT_CV_TEMPLATE)} style={{marginTop:8,background:"#1e293b",color:"#64748b",padding:"5px 12px",borderRadius:6,fontSize:11}}>↩ Reset</button>
        </Sec>
        <Sec title="✉️ Cover Letter Template">
          <div style={{padding:"10px 14px",background:"#0a1e10",border:"1px solid #166534",borderRadius:8,fontSize:11,color:"#4ade80",marginBottom:12,lineHeight:1.6}}>
            ✅ Auto-generated for <strong>LinkedIn, Indeed, Naukri</strong>. Gemini fills all placeholders from your profile.
          </div>
          <div style={{fontSize:12,color:"#475569",marginBottom:10,lineHeight:1.6}}>Placeholders: {["{name}","{email}","{phone}","{date}","{title}","{company}","{years_experience}","{top_skills}","{why_company_paragraph}","{key_achievements_paragraph}"].map(ph=><code key={ph} style={{color:"#a78bfa",marginRight:4}}>{ph}</code>)}</div>
          <textarea value={p.coverLetterTemplate} onChange={e=>set("coverLetterTemplate",e.target.value)} style={{width:"100%",minHeight:280,fontFamily:"'DM Mono',monospace",fontSize:12,lineHeight:1.7,resize:"vertical"}}/>
          <button className="btn" onClick={()=>set("coverLetterTemplate",DEFAULT_COVER_LETTER_TEMPLATE)} style={{marginTop:8,background:"#1e293b",color:"#64748b",padding:"5px 12px",borderRadius:6,fontSize:11}}>↩ Reset</button>
        </Sec>
      </>}
      <button className="btn" onClick={()=>onSave(p)} style={{width:"100%",padding:"12px",background:"linear-gradient(135deg,#2563eb,#7c3aed)",color:"white",borderRadius:10,fontSize:14,fontWeight:700,fontFamily:"inherit",marginTop:4}}>
        💾 Save Profile
      </button>
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),600);}},900);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt;
const banner=document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  setTimeout(()=>banner.classList.add('show'),6000);
});
document.getElementById('install-btn').addEventListener('click',async()=>{
  banner.classList.remove('show');
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
});
document.getElementById('dismiss-btn').addEventListener('click',()=>banner.classList.remove('show'));
const offBar=document.getElementById('offline-bar');
function updateOnline(){ offBar.classList.toggle('show',!navigator.onLine); }
window.addEventListener('online',updateOnline); window.addEventListener('offline',updateOnline); updateOnline();
</script>
</body>
